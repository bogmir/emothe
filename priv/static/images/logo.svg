<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <!-- Playcode: comedy (gold, front) and tragedy (violet, behind). Eyes and
       mouths are cut out with evenodd, so the page background shows through;
       the #gap mask cuts the back face where the front one overlaps it.
       Fixed colours, not currentColor: an <img> cannot inherit the theme. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path transform="translate(41 36) rotate(12)" fill="#000" stroke="#000" stroke-width="3.5" stroke-linejoin="round" d="M-13 -14C-6 -18 6 -18 13 -14C14 -4 12 6 6 12C3 15 -3 15 -6 12C-12 6 -14 -4 -13 -14Z"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <g transform="translate(23 27) rotate(-16)">
      <path fill="url(#violet)" fill-rule="evenodd" d="M-13 -14C-6 -18 6 -18 13 -14C14 -4 12 6 6 12C3 15 -3 15 -6 12C-12 6 -14 -4 -13 -14Z M-10.5 -5Q-6.5 4 -2.5 -7.5Q-6.5 -3 -10.5 -5Z M2.5 -7.5Q6.5 4 10.5 -5Q6.5 -3 2.5 -7.5Z M-6.5 9Q0 -3 6.5 9Q0 4 -6.5 9Z"/>
      <path fill="#38bdf8" d="M-8 0.5C-6.6 2.8 -6.2 4.4 -8 5.2C-9.8 4.4 -9.4 2.8 -8 0.5Z"/>
    </g>
  </g>
  <g transform="translate(41 36) rotate(12)">
    <path fill="url(#gold)" fill-rule="evenodd" d="M-13 -14C-6 -18 6 -18 13 -14C14 -4 12 6 6 12C3 15 -3 15 -6 12C-12 6 -14 -4 -13 -14Z M-10.5 -4Q-6.5 -12 -2.5 -4Q-6.5 -5 -10.5 -4Z M2.5 -4Q6.5 -12 10.5 -4Q6.5 -5 2.5 -4Z M-7.5 2Q0 15 7.5 2Q0 6 -7.5 2Z"/>
    <circle cx="-9" cy="5" r="2" fill="#fb7185"/>
    <circle cx="9" cy="5" r="2" fill="#fb7185"/>
  </g>
</svg>
